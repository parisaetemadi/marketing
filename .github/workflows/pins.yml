name: Build pins

# Renders the Pinterest queue from the live sites and leaves the images as a
# downloadable artifact. No secrets, no posting — this exists so a month of
# pins can be collected from a phone without running anything locally.
#
# Monthly, plus on demand. The queue is about a month long at three a week.

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      per_week:
        description: "Pins per week in the suggested schedule"
        default: "3"

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The tone and price rules are the reason this tool is allowed to make
      # pins for the bereaved segment at all. Prove they still fire before
      # rendering anything.
      - name: Prove the rules fire
        run: node bin/make-pins.js --self-test

      # --live reads the pages from production, so this workflow needs no
      # access to the product repos. google-chrome is already on the runner.
      - name: Render the queue
        run: |
          node bin/make-pins.js --live \
            --start "$(date -u -d 'tomorrow' +%Y-%m-%d)" \
            --per-week "${{ github.event.inputs.per_week || 3 }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pins-${{ github.run_number }}
          path: out/pins
          retention-days: 60

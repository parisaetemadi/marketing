name: Post a pin

# Posts the next pin in the queue, three times a week.
#
# This is the only workflow in the repo that publishes anything, so it is
# deliberately dull: one pin per run, in the order sites.js lists them, and a
# ledger committed back to the repo so a re-run posts nothing twice.
#
# It does nothing at all until the Pinterest secrets exist — a missing
# credential is a skip, not a failure, so this does not email a red run every
# Monday while the account is still being set up.
#
# Prefer the refresh-token secrets over a bare access token here. Pinterest
# access tokens expire after about thirty days, and a scheduled job holding one
# stops working a month after it is set up, silently, which is the worst way for
# something unattended to fail.
#
# --ignore-dates makes the cron schedule the calendar: whatever the queue was
# stamped with when it was generated, this posts the next unposted pin and no
# more.

on:
  schedule:
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What this manual run should do"
        type: choice
        options: [verify, post]
        default: verify

permissions:
  contents: write

concurrency:
  group: post-pins
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render the queue
        run: node bin/make-pins.js --live

      - name: Post the next pin, or verify the setup
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -z "$PINTEREST_ACCESS_TOKEN" ] && [ -z "$PINTEREST_REFRESH_TOKEN" ]; then
            echo "No Pinterest secrets set — nothing to post."
            echo "Note: they must be *Secrets*, not Variables — this workflow reads"
            echo "secrets.PINTEREST_*, and a token does not belong in a variable anyway."
            echo "See README.md."
            exit 0
          fi
          # A manual run defaults to verifying, because the reason to press the
          # button by hand is almost always "did I wire the secrets up right".
          # The schedule sends no input at all, so it posts.
          if [ "$MODE" = "verify" ]; then
            node bin/post-pins.js --verify
          else
            node bin/post-pins.js --post --ignore-dates --max 1 --ledger state/posted.json
          fi

      - name: Record what went out
        run: |
          if [ -z "$(git status --porcelain state/posted.json)" ]; then
            echo "nothing posted, nothing to record"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git commit -m "Record posted pins"
          git push
